# The test target is deliberately minimal: `Pkg.test()` must work on a clean depot with
# no extra downloads. The heavier static-analysis tools (Aqua, JET) are installed
# explicitly by the CI workflow instead, so a contributor cloning the repo offline can
# still run the full verification suite.
[extras]
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Random", "StaticArrays", "Test"]

[tool.Aqua]
ambiguities = false
piracies = false

[tool.JET]
target_level = 2
